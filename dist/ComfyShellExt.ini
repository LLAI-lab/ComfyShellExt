; ComfyShellExt 配置文件 / configuration
; 修改后需要重新运行 install.bat 才会更新“处理哪些扩展名”，
; 其余项在下一次生成缩略图时立即生效。
; Re-run install.bat after changing [extensions]; everything else is picked up
; the next time a thumbnail is generated.

[extensions]
; 由“图片处理器”接管的扩展名 / handled by the image provider
image = .png, .jpg, .jpeg, .webp, .gif, .avif
; 由“视频处理器”接管的扩展名 / handled by the video provider
video = .mp4, .webm, .mkv, .mov, .avi

[menu]
; 动态右键菜单：读取文件内容，只有真的含工作流时才出现这两项。
; Windows 11 把这类旧式扩展放在“显示更多选项”里（Shift+右键 可直接打开经典菜单）。
dynamic = 1
; 静态右键动词：能出现在 Windows 11 的一级菜单，但无法读取文件内容，
; 所以配置的所有图片/视频都会显示这两项（点了之后会告诉你有没有工作流）。
; 改动此项后需要重新运行 install.bat。
staticverbs = 0
viewlabel = 查看 ComfyUI 工作流
exportlabel = 导出工作流 JSON

[badge]
; 角标文字，可改成 WF、工作流 等；留空则只画一个纯色块
text = JSON

; ---- 位置 ----------------------------------------------------------------
; 九个锚点：TopLeft   TopCenter    TopRight
;           MiddleLeft Center      MiddleRight
;           BottomLeft BottomCenter BottomRight
; 规则很简单：写了 left/right 就贴那一边，没写就水平居中；
;             写了 top/bottom 就贴那一边，没写就垂直居中。
; 所以 "上方正中间" 就是 TopCenter，正中央是 Center。
; 默认右上角：资源管理器会在视频缩略图的右下角画默认播放器的小图标，
; 角标放右下角会被它盖住；图片为了统一也放右上角。
position = TopRight

; 与边缘的距离，按缩略图长边的百分比。3 表示 3%，256px 缩略图约 8px。
margin = 3

; 微调偏移，同样是长边百分比；正数向右 / 向下。想让 TopCenter 再往下挪一点就写 offsety = 5
offsetx = 0
offsety = 0

; ---- 大小 ----------------------------------------------------------------
; 角标大小的百分比，100 = 自动大小。想更醒目写 150，想低调写 70。
; 自动大小随缩略图长边变化（96px 缩略图约 11px 高，256px 约 23px 高）。
scale = 100

; 缩略图长边小于该值时改用纯色小块（列表 / 详细信息视图放不下文字）
textminpx = 88
; 小于该值完全不画角标，0 表示总是画
minpx = 0

; ---- 颜色 (AARRGGBB) -----------------------------------------------------
fill = E6111827
border = FF22D3EE
textcolor = FFFFFFFF

; ---- 出不了图时的兜底 ----------------------------------------------------
; Windows 出不了图时，给文件类型图标（比如播放器图标）打角标——
; 这是让"无法解码的视频"也能被标记出来的关键，关掉就只剩下面的占位块
oniconfallback = 1
; 角标落在文件类型图标上时用的位置（图标右下角常有 MP4 之类的格式标签）
iconposition = TopRight
; 当 Windows 和 ffmpeg 都无法出图，但文件确实含工作流时，画一个占位块
placeholder = 1

[detect]
; 容器解析失败时，暴力扫描文件头尾寻找工作流标记
enablerawscan = 1
; 每一端最多扫描多少 MB
maxrawscanmb = 8

[video]
; 留空则依次在本目录、本目录\bin、PATH 中寻找 ffmpeg.exe
ffmpegpath =
; 抽帧时间点（秒）
seekseconds = 1
timeoutms = 10000
; Windows 自带处理器失败时是否用 ffmpeg 抽帧（webm/vp9 常需要）
enableffmpegfallback = 1
; 视频处理器需要文件路径，而 Windows 的隔离缩略图宿主只支持流式初始化，
; 所以视频这个 COM 类必须关闭进程隔离，否则资源管理器根本无法初始化它，
; mp4/mkv/webm 会既没有缩略图也没有角标。改成 0 等于关掉视频角标功能。
disableprocessisolation = 1

[log]
; 排查问题时改成 1，日志写到 %LOCALAPPDATA%\ComfyShellExt\ComfyShellExt.log
enabled = 0
path =
